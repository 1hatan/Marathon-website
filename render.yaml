services:
  # 1. Backend Web Service (Node.js Express API)
  - type: web
    name: infinity-run-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5050
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: infinity_run
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Static Site (Vite React App)
  - type: static
    name: infinity-run-frontend
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: infinity-run-backend
          property: url
