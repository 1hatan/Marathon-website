services:
  # 1. Backend Web Service (Node.js Express API)
  - type: web
    name: infinity-run-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@infinityrun.com
      - key: ADMIN_DEFAULT_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend Static Site (Vite React App)
  - type: static
    name: infinity-run-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: infinity-run-backend
          property: url
